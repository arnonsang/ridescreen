name: APKs (phone + watch)

# Builds an installable APK for the phone app (:app) and the Wear OS app (:wear) on every pull
# request, on any working branch, and on demand (Actions → "APKs (phone + watch)" → Run workflow).
# The two build in parallel and each is uploaded as its own artifact.
#
# Branches that build.yml already covers (main, test/**, feature/**, release/**, prerelease/**)
# are skipped here so a push never builds twice; releases are still published by build.yml.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore: [main, 'test/**', 'feature/**', 'release/**', 'prerelease/**']

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            label: Phone
            file: RideScreen-AA-phone
          - module: wear
            label: Watch
            file: RideScreen-AA-watch-WearOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # The phone and the watch app must carry the same signature (Wear OS only links apps signed
      # alike), and an update only installs over the previous build when the key is the same.
      # Put a keystore in the DEBUG_KEYSTORE_B64 repository secret (base64 of a JKS, alias
      # androiddebugkey, passwords "android") to get that. Without it every run makes a throwaway
      # key: the APKs still install, but only after uninstalling the previous build, and the
      # watch won't pair with a phone APK from a different run.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set: this APK is signed with a throwaway key and won't install over a previous build"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build ${{ matrix.label }} APK
        run: |
          chmod +x gradlew
          ./gradlew ":${{ matrix.module }}:assembleGithubRelease" \
            -PappVersion=1 -PversionSuffix="-dev.${GITHUB_RUN_NUMBER}" --console=plain

      - name: Unit tests
        if: matrix.module == 'app'
        # The same set build.yml runs. Three other tests fail on an untouched checkout too
        # (AndroidAutoServiceTest, PkeBatteryTest, YunmoFrameTest), so the full suite isn't gated yet.
        run: >
          ./gradlew :app:testGithubDebugUnitTest --console=plain
          --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest'
          --tests 'dev.zanderp.opencfmoto.ClockLabTest'
          --tests 'dev.zanderp.opencfmoto.UpdateCheckerForkTest'
          --tests 'dev.zanderp.opencfmoto.TrophiesTest'
          --tests 'dev.zanderp.opencfmoto.TripHighlightsTest'
          --tests 'dev.zanderp.opencfmoto.CarbitBleNetTest'
          --tests 'dev.zanderp.opencfmoto.GreenWaveTest'
          --tests 'dev.zanderp.opencfmoto.TripCompareTest'
          --tests 'dev.zanderp.opencfmoto.MaintenanceScheduleTest'

      - name: Collect APK
        id: apk
        run: |
          SRC="$(find "${{ matrix.module }}/build/outputs/apk/github/release" -name '*.apk' | head -1)"
          [ -n "$SRC" ] || { echo "::error::no APK produced for ${{ matrix.module }}"; exit 1; }
          mkdir -p dist
          OUT="dist/${{ matrix.file }}-${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$OUT"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          {
            echo "### ${{ matrix.label }} APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$(basename "$OUT")\` |"
            echo "| Size | $(du -h "$OUT" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$OUT" | cut -d' ' -f1)\` |"
            echo "| Signer | \`$("$BT/apksigner" verify --print-certs "$OUT" | grep -i 'SHA-256' | head -1 | awk '{print $NF}')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
